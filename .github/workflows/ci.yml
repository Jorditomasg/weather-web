name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --watch=false

      # Unit tests only compile what the specs import; the build type-checks every template
      - name: Build
        run: npm run build
